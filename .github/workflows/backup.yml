name: Backup do banco de dados

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 01:00 BRT todo dia
  workflow_dispatch:        # permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar postgresql-client-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18 age

      - name: Gerar dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          FILENAME="usecognia-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-acl \
            --no-owner \
            --file="$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "Backup gerado: $FILENAME ($SIZE)"

      - name: Criptografar dump antes do upload
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "BACKUP_AGE_RECIPIENT nao configurado; recusando upload sem criptografia."
            exit 1
          fi
          ENCRYPTED_FILENAME="${FILENAME}.age"
          age --recipient "$BACKUP_AGE_RECIPIENT" --output "$ENCRYPTED_FILENAME" "$FILENAME"
          shred --remove "$FILENAME"
          echo "ENCRYPTED_FILENAME=$ENCRYPTED_FILENAME" >> "$GITHUB_ENV"
          sha256sum "$ENCRYPTED_FILENAME" > "${ENCRYPTED_FILENAME}.sha256"

      - name: Salvar artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: |
            ${{ env.ENCRYPTED_FILENAME }}
            ${{ env.ENCRYPTED_FILENAME }}.sha256
          retention-days: 30
          if-no-files-found: error
