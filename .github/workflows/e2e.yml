name: Production E2E Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: production-e2e-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run focused production smoke tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://usecognia.com.br' }}
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'https://psicosaas-production-2d6c.up.railway.app/api' }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
        run: npm run test:e2e -- usecognia.smoke.spec.ts public-pricing.spec.ts dpa.spec.ts seo.spec.ts marketing-truth.spec.ts neuropsych-battery.spec.ts --project=chromium

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-failure
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
