name: Publicação diária do blog

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Apenas pesquisar e validar, sem publicar
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-blog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testar curadoria
        working-directory: frontend
        run: node --test scripts/publish-daily-news.test.mjs

      - name: Pesquisar fontes e preparar artigo
        id: news
        working-directory: frontend
        env:
          BLOG_NEWS_MAX_ITEMS: '3'
        run: |
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            node scripts/publish-daily-news.mjs --dry-run
          else
            node scripts/publish-daily-news.mjs
          fi
          if git diff --quiet -- src/content/blog-posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        if: steps.news.outputs.changed == 'true'
        working-directory: frontend
        run: npm ci

      - name: Gerar SEO, imagem e páginas estáticas
        if: steps.news.outputs.changed == 'true'
        working-directory: frontend
        run: npm run build

      - name: Publicar na main
        if: steps.news.outputs.changed == 'true'
        run: |
          git config user.name "usecognia-blog-bot"
          git config user.email "usecognia@gmail.com"
          git add -- frontend/src/content/blog-posts.json frontend/public/blog/og frontend/public/feed.xml frontend/public/llms.txt frontend/public/sitemap.xml
          git diff --cached --check
          git commit -m "chore(blog): publicar curadoria de $(date -u +%F)"
          git push origin HEAD:main
