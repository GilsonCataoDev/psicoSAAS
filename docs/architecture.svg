  <text x="780" y="380" text-anchor="middle" font-size="9" fill="#64748b">Deploy backend · PostgreSQL</text>

  <rect x="685" y="400" width="190" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="780" y="416" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Vercel</text>
  <text x="780" y="430" text-anchor="middle" font-size="9" fill="#64748b">Deploy frontend · CDN</text>

