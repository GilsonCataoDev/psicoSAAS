  <rect x="245" y="306" width="86" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="288" y="321" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Instruments</text>
  <text x="288" y="335" text-anchor="middle" font-size="8.5" fill="#64748b">29 escalas clínicas</text>

  <rect x="339" y="306" width="86" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="382" y="321" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Admin</text>
