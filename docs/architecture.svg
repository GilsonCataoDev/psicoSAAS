  <rect x="433" y="306" width="86" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="476" y="321" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Churn</text>
