  <rect x="245" y="260" width="86" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="288" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Notifications</text>
