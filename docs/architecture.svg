<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Arquitetura UseCognia</title>
  <desc>Diagrama da arquitetura do SaaS UseCognia: frontend React no Vercel, backend NestJS no Railway, PostgreSQL 16 e serviços externos.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#ffffff"/>

  <!-- Client section -->
  <rect x="10" y="10" width="200" height="695" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="110" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">CLIENTE</text>

  <!-- Backend section -->
  <rect x="230" y="10" width="420" height="695" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">BACKEND · NestJS 11 · Railway</text>

  <!-- External services section -->
  <rect x="670" y="10" width="220" height="695" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">SERVIÇOS EXTERNOS</text>

  <!-- ===== CLIENT ===== -->
  <rect x="25" y="50" width="170" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="110" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Navegador</text>
  <text x="110" y="90" text-anchor="middle" font-size="10" fill="#64748b">React 18 + Vite · Vercel</text>

  <rect x="25" y="130" width="170" height="46" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="149" text-anchor="middle" font-size="11" font-weight="600" fill="#6366f1">Pages (lazy)</text>
  <text x="110" y="165" text-anchor="middle" font-size="9.5" fill="#64748b">Dashboard · Agenda · Pacientes…</text>

  <rect x="25" y="186" width="170" height="46" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#6366f1">Hooks / useApi</text>
  <text x="110" y="221" text-anchor="middle" font-size="9.5" fill="#64748b">TanStack Query v5 · 15 domínios</text>

  <rect x="25" y="242" width="170" height="46" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#6366f1">Store (Zustand)</text>
  <text x="110" y="277" text-anchor="middle" font-size="9.5" fill="#64748b">auth · subscription · ui</text>

  <rect x="25" y="310" width="170" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="110" y="329" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Booking Público</text>
  <text x="110" y="345" text-anchor="middle" font-size="9.5" fill="#64748b">/book/:slug · sem auth</text>

  <rect x="25" y="370" width="80" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="65" y="384" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">PWA</text>
  <text x="65" y="398" text-anchor="middle" font-size="9" fill="#64748b">VitePWA</text>

  <rect x="115" y="370" width="80" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="155" y="384" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Push Web</text>
  <text x="155" y="398" text-anchor="middle" font-size="9" fill="#64748b">VAPID</text>

