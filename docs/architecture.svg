  <rect x="245" y="120" width="180" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="335" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Throttle / Rate Limit</text>
