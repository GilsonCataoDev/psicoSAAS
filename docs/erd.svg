<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>ERD — UseCognia</title>
  <desc>Diagrama entidade-relacionamento do banco de dados PostgreSQL do UseCognia.</desc>

  <rect width="960" height="760" fill="#ffffff"/>

  <defs>
    <marker id="pk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="fk" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- USERS (centro) -->
  <!-- ============================================================ -->
  <g id="users">
    <rect x="370" y="30" width="220" height="210" rx="8" fill="#f0f0ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="370" y="30" width="220" height="28" rx="8" fill="#6366f1"/>
    <rect x="370" y="50" width="220" height="10" fill="#6366f1"/>
    <text x="480" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">users</text>
    <text x="382" y="75" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="382" y="91" font-size="10" fill="#475569">name · email (unique)</text>
    <text x="382" y="107" font-size="10" fill="#475569">passwordHash · crp</text>
    <text x="382" y="123" font-size="10" fill="#475569">specialty · avatarUrl · phone</text>
    <text x="382" y="139" font-size="10" fill="#475569">cpfCnpj · referralCode</text>
    <text x="382" y="155" font-size="10" fill="#475569">emailVerified · isActive</text>
    <text x="382" y="171" font-size="10" fill="#475569">preferences (jsonb)</text>
    <text x="382" y="187" font-size="10" fill="#475569">lastActiveAt</text>
    <text x="382" y="203" font-size="10" fill="#94a3b8">createdAt · updatedAt</text>
    <text x="382" y="228" font-size="9" fill="#6366f1">↳ psychologistId em: patients, appointments,</text>
    <text x="382" y="240" font-size="9" fill="#6366f1">  sessions, financial_records, bookings…</text>
  </g>

  <!-- ============================================================ -->
  <!-- PATIENTS -->
  <!-- ============================================================ -->
  <g id="patients">
    <rect x="30" y="200" width="210" height="220" rx="8" fill="#f0fff4" stroke="#10b981" stroke-width="1.5"/>
    <rect x="30" y="200" width="210" height="28" rx="8" fill="#10b981"/>
    <rect x="30" y="220" width="210" height="10" fill="#10b981"/>
    <text x="135" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">patients</text>
    <text x="42" y="245" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="42" y="261" font-size="10" fill="#475569">name · email · phone · birthDate</text>
    <text x="42" y="277" font-size="10" fill="#475569">pronouns · race · gender</text>
    <text x="42" y="293" font-size="10" fill="#475569">status · sessionPrice · sessionDuration</text>
    <text x="42" y="309" font-size="10" fill="#475569">privateNotes (enc) · prontuario (enc)</text>
    <text x="42" y="325" font-size="10" fill="#475569">hasFixedSchedule · tags</text>
    <text x="42" y="341" font-size="10" fill="#475569">asaasCustomerId · cpfCnpj</text>
    <text x="42" y="357" font-size="10" fill="#475569">portalTokenHash</text>
    <text x="42" y="375" font-size="10" fill="#e11d48">🔗 psychologistId (FK → users)</text>
    <text x="42" y="391" font-size="9" fill="#94a3b8">createdAt · updatedAt</text>
  </g>

  <!-- users → patients -->
  <line x1="370" y1="120" x2="240" y2="310" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#pk)"/>
  <text x="280" y="215" font-size="9" fill="#6366f1">1</text>
  <text x="255" y="295" font-size="9" fill="#6366f1">N</text>

  <!-- ============================================================ -->
  <!-- APPOINTMENTS -->
  <!-- ============================================================ -->
  <g id="appointments">
    <rect x="30" y="450" width="210" height="175" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="30" y="450" width="210" height="28" rx="8" fill="#f59e0b"/>
    <rect x="30" y="470" width="210" height="10" fill="#f59e0b"/>
    <text x="135" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">appointments</text>
    <text x="42" y="495" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="42" y="511" font-size="10" fill="#475569">date · time · duration · status</text>
    <text x="42" y="527" font-size="10" fill="#475569">modality · meetingUrl · notes</text>
    <text x="42" y="543" font-size="10" fill="#475569">isRecurring · recurringGroupId</text>
    <text x="42" y="559" font-size="10" fill="#475569">reminder24hSentAt · reminder2hSentAt</text>
    <text x="42" y="577" font-size="10" fill="#e11d48">🔗 patientId (FK → patients)</text>
    <text x="42" y="593" font-size="10" fill="#e11d48">🔗 psychologistId (FK → users)</text>
    <text x="42" y="609" font-size="9" fill="#94a3b8">createdAt</text>
  </g>

  <!-- patients → appointments -->
  <line x1="135" y1="420" x2="135" y2="449" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#pk)"/>
  <text x="140" y="440" font-size="9" fill="#10b981">1→N</text>

  <!-- ============================================================ -->
  <!-- SESSIONS -->
  <!-- ============================================================ -->
  <g id="sessions">
    <rect x="260" y="450" width="190" height="165" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="260" y="450" width="190" height="28" rx="8" fill="#a855f7"/>
    <rect x="260" y="470" width="190" height="10" fill="#a855f7"/>
    <text x="355" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">sessions</text>
    <text x="272" y="495" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="272" y="511" font-size="10" fill="#475569">date · duration · mood</text>
    <text x="272" y="527" font-size="10" fill="#475569">summary (enc) · privateNotes (enc)</text>
    <text x="272" y="543" font-size="10" fill="#475569">nextSteps (enc) · tags</text>
    <text x="272" y="559" font-size="10" fill="#475569">paymentStatus · appointmentId</text>
    <text x="272" y="577" font-size="10" fill="#e11d48">🔗 patientId (FK → patients)</text>
    <text x="272" y="593" font-size="10" fill="#e11d48">🔗 psychologistId (FK → users)</text>
    <text x="272" y="609" font-size="9" fill="#94a3b8">createdAt · updatedAt</text>
  </g>

  <!-- patients → sessions -->
  <line x1="200" y1="380" x2="310" y2="449" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#pk)"/>
  <text x="250" y="420" font-size="9" fill="#10b981">1→N</text>

  <!-- ============================================================ -->
  <!-- BILLING_SUBSCRIPTIONS -->
  <!-- ============================================================ -->
  <g id="billing">
    <rect x="620" y="30" width="200" height="165" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <rect x="620" y="30" width="200" height="28" rx="8" fill="#f97316"/>
    <rect x="620" y="50" width="200" height="10" fill="#f97316"/>
    <text x="720" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">billing_subscriptions</text>
    <text x="632" y="75" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="632" y="91" font-size="10" fill="#475569">plan · status</text>
    <text x="632" y="107" font-size="10" fill="#475569">gatewayCustomerId</text>
    <text x="632" y="123" font-size="10" fill="#475569">gatewaySubscriptionId</text>
    <text x="632" y="139" font-size="10" fill="#475569">trialEndsAt · currentPeriodEnd</text>
    <text x="632" y="155" font-size="10" fill="#475569">cancelAtPeriodEnd · hasUsedTrial</text>
    <text x="632" y="171" font-size="10" fill="#e11d48">🔗 userId (FK → users)</text>
    <text x="632" y="187" font-size="9" fill="#94a3b8">createdAt</text>
  </g>

  <!-- users → billing -->
  <line x1="590" y1="100" x2="619" y2="100" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#pk)"/>
  <text x="597" y="95" font-size="9" fill="#f97316">1→1</text>

  <!-- ============================================================ -->
  <!-- FINANCIAL_RECORDS -->
  <!-- ============================================================ -->
  <g id="financial">
    <rect x="620" y="220" width="200" height="165" rx="8" fill="#f0fff4" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="620" y="220" width="200" height="28" rx="8" fill="#22c55e"/>
    <rect x="620" y="240" width="200" height="10" fill="#22c55e"/>
    <text x="720" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">financial_records</text>
    <text x="632" y="265" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="632" y="281" font-size="10" fill="#475569">type · amount · description</text>
    <text x="632" y="297" font-size="10" fill="#475569">status · dueDate · paidAt · method</text>
    <text x="632" y="313" font-size="10" fill="#475569">asaasPaymentId · paymentLinkUrl</text>
    <text x="632" y="329" font-size="10" fill="#475569">receiptUrl · sessionId</text>
    <text x="632" y="347" font-size="10" fill="#e11d48">🔗 patientId (FK → patients, null)</text>
    <text x="632" y="363" font-size="10" fill="#e11d48">🔗 psychologistId (FK → users)</text>
    <text x="632" y="379" font-size="9" fill="#94a3b8">createdAt</text>
  </g>

  <!-- users → financial -->
  <line x1="590" y1="190" x2="619" y2="290" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#pk)"/>

  <!-- ============================================================ -->
  <!-- BOOKINGS -->
  <!-- ============================================================ -->
  <g id="bookings">
    <rect x="620" y="410" width="200" height="195" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <rect x="620" y="410" width="200" height="28" rx="8" fill="#eab308"/>
    <rect x="620" y="430" width="200" height="10" fill="#eab308"/>
    <text x="720" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">bookings</text>
    <text x="632" y="455" font-size="10" fill="#1e293b">🔑 id (uuid PK)</text>
    <text x="632" y="471" font-size="10" fill="#475569">patientName · patientEmail</text>
    <text x="632" y="487" font-size="10" fill="#475569">date · time · duration · modality</text>
    <text x="632" y="503" font-size="10" fill="#475569">status · paymentStatus · amount</text>
    <text x="632" y="519" font-size="10" fill="#475569">confirmationToken (unique)</text>
    <text x="632" y="535" font-size="10" fill="#475569">tokenExpiresAt (48h)</text>
    <text x="632" y="551" font-size="10" fill="#475569">appointmentId (após confirm)</text>
    <text x="632" y="567" font-size="10" fill="#475569">patientNotes</text>
    <text x="632" y="585" font-size="10" fill="#e11d48">🔗 psychologistId (FK → users)</text>
    <text x="632" y="601" font-size="9" fill="#94a3b8">createdAt · updatedAt</text>
  </g>

  <!-- users → bookings -->
  <line x1="590" y1="200" x2="700" y2="409" stroke="#eab308" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#pk)"/>

  <!-- ============================================================ -->
  <!-- Legenda + tabelas menores -->
  <!-- ============================================================ -->
  <g id="other-tables">
    <rect x="260" y="640" width="320" height="105" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="272" y="660" font-size="10" font-weight="700" fill="#1e293b">Outras tabelas (omitidas por clareza)</text>
    <text x="272" y="678" font-size="9.5" fill="#475569">• refresh_tokens — JWT rotation, hash SHA-256</text>
    <text x="272" y="694" font-size="9.5" fill="#475569">• audit_logs — eventos sensíveis por usuário</text>
    <text x="272" y="710" font-size="9.5" fill="#475569">• email_logs — histórico de e-mails enviados</text>
    <text x="272" y="726" font-size="9.5" fill="#475569">• instrument_assignments — escalas clínicas por paciente</text>
    <text x="272" y="742" font-size="9.5" fill="#475569">• availability_slots · booking_pages · templates · documents</text>
  </g>

  <!-- Legenda linha -->
  <g id="legend">
    <rect x="30" y="650" width="210" height="80" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="42" y="668" font-size="10" font-weight="700" fill="#1e293b">Legenda</text>
    <text x="42" y="685" font-size="9.5" fill="#475569">🔑  Chave primária (PK)</text>
    <text x="42" y="701" font-size="9.5" fill="#e11d48">🔗  Chave estrangeira (FK)</text>
    <line x1="42" y1="714" x2="80" y2="714" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="86" y="718" font-size="9.5" fill="#475569">Relacionamento 1→N</text>
    <text x="42" y="730" font-size="9" fill="#475569">(enc) = criptografado AES-256-GCM</text>
  </g>

  <!-- Título -->
  <text x="480" y="730" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">UseCognia — Modelo de Dados (ERD simplificado)</text>
  <text x="480" y="748" text-anchor="middle" font-size="9.5" fill="#64748b">PostgreSQL 16 · TypeORM 0.3 · todas as tabelas isoladas por psychologistId</text>
</svg>
