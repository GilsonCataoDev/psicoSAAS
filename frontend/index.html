    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O teste de 7 dias é realmente gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Nenhum valor é cobrado durante os 7 dias de teste. Cancele antes do vencimento e não haverá cobrança."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso cadastrar cartão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O cartão é necessário no cadastro para iniciar o teste. Isso garante a continuidade do serviço após o período gratuito caso você opte por continuar."
          }
        },
        {
          "@type": "Question",
          "name": "Quem pode usar o UseCognia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Profissionais de saúde autônomos no Brasil — psicologia, nutrição, fisioterapia, fonoaudiologia, terapia ocupacional, odontologia e afins — que querem organizar agenda, pessoas atendidas, registros e rotina de atendimento. Os termos e os recursos da plataforma se ajustam à profissão escolhida no cadastro."
          }
        },
        {
          "@type": "Question",
          "name": "Meus dados e os dos meus pacientes ficam seguros?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O UseCognia aplica HTTPS, hash seguro de senhas, controle de acesso e isolamento entre contas. Nenhum sistema é absolutamente seguro; consulte a página de Segurança para conhecer os controles e limites."
          }
        },
        {
          "@type": "Question",
          "name": "O paciente precisa instalar aplicativo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. A proposta é que links públicos e páginas de confirmação abram direto no navegador do celular ou computador."
          }
        }
      ]
    }
    </script>
