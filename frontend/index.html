    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "O UseCognia é gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O plano gratuito não exige cartão e não tem prazo para expirar. Os planos pagos adicionam mais capacidade e automações."
          }
        },
        {
          "@type": "Question",
          "name": "O prontuário eletrônico é seguro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As notas clínicas são criptografadas com AES-256-GCM, com conexão HTTPS, autenticação individual e isolamento entre contas. A adequação à LGPD é um processo contínuo e não substitui as obrigações profissionais do usuário."
          }
        },
        {
          "@type": "Question",
          "name": "Posso usar o UseCognia no celular?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O UseCognia funciona como Progressive Web App (PWA) em qualquer smartphone, tablet ou computador, sem precisar instalar nada."
          }
        },
        {
          "@type": "Question",
          "name": "Como funcionam os lembretes automáticos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No plano Pro, lembretes podem ser enviados via WhatsApp 24h e 1h antes da consulta quando a integração estiver conectada e o provedor estiver disponível."
          }
        }
      ]
